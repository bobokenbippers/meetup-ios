name: CodeQL

on:
  pull_request:
    branches:
      - main
    # PRs only run the fast edge-function analysis; Swift analysis is
    # gated off PRs entirely (see analyze-swift below).
    paths:
      - "supabase/functions/**"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - main
    paths:
      - "meetup-ios/**"
      - "meetup-ios.xcodeproj/**"
      - "supabase/functions/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze Swift
    # The Swift analysis needs a full traced rebuild (~30 min on a macOS
    # runner), so it runs only on pushes to main, the weekly schedule, and
    # manual dispatch — never on PRs. Edge-function analysis stays on PRs.
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git for SPM
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Write placeholder Secrets.xcconfig
        run: cp Secrets.example.xcconfig Secrets.xcconfig

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project meetup-ios.xcodeproj \
            -scheme meetup-ios \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  analyze-functions:
    name: Analyze Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
