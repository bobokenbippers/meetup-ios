name: CodeQL

# Never runs on PRs — analysis happens on main pushes, the weekly schedule,
# and on demand via the Actions tab (Run workflow).
on:
  push:
    branches:
      - main
    paths:
      - "meetup-ios/**"
      - "meetup-ios.xcodeproj/**"
      - "supabase/functions/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-swift:
    name: Analyze Swift
    # Needs a full traced rebuild — ~30 min on a macOS runner.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Git for SPM
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Write placeholder Secrets.xcconfig
        run: cp Secrets.example.xcconfig Secrets.xcconfig

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: swift
          build-mode: manual

      - name: Build for analysis
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project meetup-ios.xcodeproj \
            -scheme meetup-ios \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8

  analyze-functions:
    name: Analyze Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.8
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.8
