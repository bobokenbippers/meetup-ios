name: Dependency Review

on:
  pull_request:
    branches:
      - main
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "meetup-ios.xcodeproj/project.pbxproj"
      - "meetup-ios.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
