name: CI

on:
  # Public-repo safety: do not change this to pull_request_target unless the
  # workflow is redesigned to avoid running untrusted code with privileged context.
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same ref,
# so stacked merges don't each tie up a (10x-priced) macOS runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git for SPM
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Write placeholder Secrets.xcconfig
        run: cp Secrets.example.xcconfig Secrets.xcconfig

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project meetup-ios.xcodeproj \
            -scheme meetup-ios \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project meetup-ios.xcodeproj \
            -scheme meetup-ios \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            | xcpretty

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
