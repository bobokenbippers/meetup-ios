name: Regenerate Push Profiles

# One-shot manual job: enables the Push Notifications capability on the App ID
# and force-regenerates the App Store provisioning profile (committing it to the
# Match git repo), then builds + uploads to TestFlight so the fix ships in one run.
# Needed because the regular TestFlight lane runs `match` in readonly mode and
# cannot regenerate a profile that is missing the aps-environment entitlement.

on:
  workflow_dispatch:
    inputs:
      also_ship:
        description: "Also build & upload to TestFlight after regenerating"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  regen:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Configure Git for Match and SPM
        run: |
          git config --global url."https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Write Secrets.xcconfig from secrets
        run: |
          cat > Secrets.xcconfig <<EOF
          TICKETMASTER_API_KEY = ${{ secrets.TICKETMASTER_API_KEY }}
          EOF
          test -n "${{ secrets.TICKETMASTER_API_KEY }}" || (echo "TICKETMASTER_API_KEY is required for TestFlight builds" && exit 1)

      - name: Regenerate profiles (enable Push + match --force)
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane regen_profiles

      - name: Build & upload to TestFlight
        if: ${{ inputs.also_ship }}
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane beta
