name: SwiftLint

# Warning-only for now: violations appear as PR annotations but never
# block the check. Drop `continue-on-error` once the codebase is clean.
on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".swiftlint.yml"
      - ".github/workflows/swiftlint.yml"

permissions:
  contents: read

concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        continue-on-error: true
        run: swiftlint lint --reporter github-actions-logging
