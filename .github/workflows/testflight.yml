name: TestFlight

# Betas now ship on demand only. Trigger from the Actions tab (Run workflow)
# or by pushing a 'beta-*' tag, instead of auto-building on every merge to main.
# A single afternoon of stacked merges previously archived ~14 macOS builds.
on:
  workflow_dispatch:
  push:
    tags:
      - 'beta-*'

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Configure Git for Match and SPM
        run: |
          git config --global url."https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Write Secrets.xcconfig from secrets
        run: |
          cat > Secrets.xcconfig <<EOF
          GOOGLE_PLACES_API_KEY = ${{ secrets.GOOGLE_PLACES_API_KEY }}
          TICKETMASTER_API_KEY = ${{ secrets.TICKETMASTER_API_KEY }}
          EOF

      - name: Run Fastlane beta
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane beta
