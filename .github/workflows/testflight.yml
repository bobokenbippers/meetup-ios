name: TestFlight

# Betas ship on demand only. Trigger from the Actions tab (Run workflow)
# instead of auto-building on every merge to main.
# A single afternoon of stacked merges previously archived ~14 macOS builds.
on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: 'Type YES to confirm uploading a new TestFlight build'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm upload
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit YES
        run: |
          if [ "${{ inputs.confirm_upload }}" != "YES" ]; then
            echo "::error::TestFlight upload not confirmed. Re-run and type YES in the confirm_upload field."
            exit 1
          fi

  build:
    needs: confirm
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Configure Git for Match and SPM
        run: |
          git config --global url."https://x-access-token:${{ secrets.MATCH_GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Write Secrets.xcconfig from secrets
        run: |
          cat > Secrets.xcconfig <<EOF
          TICKETMASTER_API_KEY = ${{ secrets.TICKETMASTER_API_KEY }}
          EOF
          test -n "${{ secrets.TICKETMASTER_API_KEY }}" || (echo "TICKETMASTER_API_KEY is required for TestFlight builds" && exit 1)

      - name: Run Fastlane beta
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane beta
