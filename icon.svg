<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep midnight to violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0820;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E1254;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D2B8E;stop-opacity:1" />
    </linearGradient>
    <!-- Glow gradient for the monogram -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B71D4;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#6C57C5;stop-opacity:0" />
    </radialGradient>
    <!-- Letter gradient: bright white to lavender -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B8F0;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle shimmer on letters -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#E8E0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9E8EE0;stop-opacity:1" />
    </linearGradient>
    <!-- Accent ring glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Strong text glow -->
    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- iOS rounded rect clip -->
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- iOS rounded rect clip -->
  <g clip-path="url(#roundedClip)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- Subtle noise/texture via overlapping circles -->
    <circle cx="180" cy="180" r="320" fill="#6C57C5" opacity="0.06"/>
    <circle cx="850" cy="850" r="280" fill="#4A3A9E" opacity="0.08"/>
    <circle cx="900" cy="120" r="200" fill="#8B71D4" opacity="0.05"/>

    <!-- Central glow halo -->
    <ellipse cx="512" cy="512" rx="340" ry="340" fill="url(#glowGrad)"/>

    <!-- Accent ring (subtle violet circle) -->
    <circle cx="512" cy="512" r="360" fill="none" stroke="#6C57C5" stroke-width="1.5" opacity="0.25"/>
    <circle cx="512" cy="512" r="340" fill="none" stroke="#8B71D4" stroke-width="0.8" opacity="0.15"/>

    <!--
      SB Monogram — using path-based letterforms for crisp, bold look
      S: centered around x=340, B: centered around x=660
      Baseline at y=590, cap height ~330px
    -->

    <!-- S letterform -->
    <g filter="url(#textGlow)">
      <!-- S drawn as a bold rounded letter -->
      <text
        x="512"
        y="610"
        font-family="'SF Pro Display', 'Helvetica Neue', 'Arial Black', sans-serif"
        font-size="460"
        font-weight="900"
        letter-spacing="-30"
        text-anchor="middle"
        fill="url(#shimmer)"
      >SB</text>
    </g>

    <!-- Sparkle dots — top right area -->
    <g opacity="0.85" filter="url(#glow)">
      <!-- Star 1 -->
      <g transform="translate(820, 170)">
        <line x1="0" y1="-18" x2="0" y2="18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <line x1="-18" y1="0" x2="18" y2="0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <line x1="-13" y1="-13" x2="13" y2="13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <line x1="13" y1="-13" x2="-13" y2="13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      </g>
      <!-- Star 2 (smaller) -->
      <g transform="translate(760, 110)">
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#C4B8F0" stroke-width="2" stroke-linecap="round"/>
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#C4B8F0" stroke-width="2" stroke-linecap="round"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#C4B8F0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7" y1="-7" x2="-7" y2="7" stroke="#C4B8F0" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="2.5" fill="#C4B8F0"/>
      </g>
      <!-- Star 3 (tiny) -->
      <g transform="translate(870, 250)">
        <line x1="0" y1="-7" x2="0" y2="7" stroke="#8B71D4" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-7" y1="0" x2="7" y2="0" stroke="#8B71D4" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="2" fill="#8B71D4"/>
      </g>
    </g>

    <!-- Sparkle dots — bottom left area -->
    <g opacity="0.6" filter="url(#glow)">
      <g transform="translate(180, 850)">
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#9E8EE0" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#9E8EE0" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="#9E8EE0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="-10" x2="-10" y2="10" stroke="#9E8EE0" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="3" fill="#9E8EE0"/>
      </g>
      <g transform="translate(240, 790)">
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#C4B8F0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#C4B8F0" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="2" fill="#C4B8F0"/>
      </g>
    </g>

    <!-- Bottom accent line -->
    <rect x="362" y="680" width="300" height="4" rx="2" fill="#6C57C5" opacity="0.6"/>
  </g>
</svg>
